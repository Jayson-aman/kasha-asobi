<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="カシャカシャあそび アイコン">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1024" y2="1024" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF7FB0"/>
      <stop offset="0.55" stop-color="#FF6B9D"/>
      <stop offset="1" stop-color="#9B6BFF"/>
    </linearGradient>
    <linearGradient id="bag" x1="300" y1="330" x2="740" y2="820" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FFF0F6"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#000000" flood-opacity="0.14"/>
    </filter>
  </defs>

  <!-- 背景（角丸は OS が付与するので全面塗り） -->
  <rect width="1024" height="1024" fill="url(#bg)"/>

  <!-- 音のリップル -->
  <g stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="14" fill="none">
    <path d="M212 512a300 300 0 0 1 90 -214" stroke-linecap="round"/>
    <path d="M812 512a300 300 0 0 0 -90 -214" stroke-linecap="round"/>
  </g>

  <!-- カシャカシャ袋 -->
  <g filter="url(#soft)">
    <!-- 持ち手 -->
    <path d="M420 372c0-52 42-94 92-94s92 42 92 94" stroke="#FFFFFF" stroke-width="40" fill="none" stroke-linecap="round"/>
    <!-- 袋本体（口が広く、底が少しすぼまる。左右にクシャッとしたノッチ） -->
    <path d="M336 356
             L688 356
             Q724 356 720 392
             L690 720
             Q686 772 634 772
             L390 772
             Q338 772 334 720
             L304 392
             Q300 356 336 356 Z" fill="url(#bag)"/>
    <!-- クシャッとした折り目 -->
    <g stroke="#FF6B9D" stroke-opacity="0.35" stroke-width="12" stroke-linecap="round" fill="none">
      <path d="M410 430 L470 520 L410 610 L462 700"/>
      <path d="M600 430 L548 520 L604 610 L556 700"/>
      <path d="M512 415 L512 715"/>
    </g>
  </g>

  <!-- きらめき -->
  <g fill="#FFE05A">
    <path d="M772 300c14 44 24 54 68 68-44 14-54 24-68 68-14-44-24-54-68-68 44-14 54-24 68-68Z"/>
    <path d="M286 660c10 30 16 36 46 46-30 10-36 16-46 46-10-30-16-36-46-46 30-10 36-16 46-46Z"/>
  </g>
  <circle cx="742" cy="742" r="20" fill="#FFFFFF" fill-opacity="0.9"/>
  <circle cx="300" cy="286" r="16" fill="#FFFFFF" fill-opacity="0.85"/>
</svg>
